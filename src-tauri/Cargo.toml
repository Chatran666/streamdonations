[package]
name = "streamdonations"
version = "2.0.0"
description = "Donaciones de Ceneka, YouTube, Twitch y Kick en un panel y en OBS"
authors = ["Mariano (Chatran666)"]
license = "MIT"
repository = "https://github.com/Chatran666/streamdonations"
edition = "2021"
rust-version = "1.77"

[lib]
name = "streamdonations_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["net", "sync", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
