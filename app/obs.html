        /* Meta de donaciones (opcional) */

        body.has-top #obs-top { display: flex; }

        #obs-goal {
            display: none;

        body.has-goal #obs-goal { display: block; }
        .obs-goal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }

        .obs-goal-track { height: 12px; border-radius: 999px; background: rgba(var(--obs-ink-rgb), 0.1); overflow: hidden; }

        #obs-goal.complete .obs-goal-fill { background: linear-gradient(90deg, #10B981, #34D399); }

        /* Twitch y Kick */
        .obs-alert.twitch { border-color: #9146FF; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(145, 70, 255, 0.35); }
        .obs-alert.kick { border-color: #53FC18; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(83, 252, 24, 0.3); }
        .obs-tag.twitch { background: rgba(145, 70, 255, 0.3); color: #D8C4FF; border: 1px solid rgba(145, 70, 255, 0.5); }
        .obs-tag.kick { background: rgba(83, 252, 24, 0.2); color: #A6FF85; border: 1px solid rgba(83, 252, 24, 0.5); }
        .obs-alert.twitch .obs-msg { border-left-color: #9146FF; }
        .obs-alert.kick .obs-msg { border-left-color: #53FC18; }

        /* Tamaño del texto configurable desde la app */
        :root { --obs-scale: 1; }
        .obs-nick { font-size: calc(1.15rem * var(--obs-scale)) !important; }
        :root { --obs-amount-scale: 0.8; }
        .obs-amount {
            font-size: calc(1.35rem * var(--obs-scale) * var(--obs-amount-scale)) !important;
            padding: calc(4px * var(--obs-amount-scale)) calc(12px * var(--obs-amount-scale)) !important;
        }
        .obs-msg { font-size: calc(1.02rem * var(--obs-scale)) !important; }
        .obs-avatar { width: calc(42px * var(--obs-scale)) !important; height: calc(42px * var(--obs-scale)) !important; font-size: calc(1.1rem * var(--obs-scale)) !important; }
        .obs-tag { font-size: calc(0.62rem * var(--obs-scale)) !important; }
        .obs-status-box { font-size: calc(1rem * var(--obs-scale)); }
        .obs-goal-title { font-size: calc(0.95rem * var(--obs-scale)) !important; }
        .obs-goal-nums { font-size: calc(0.85rem * var(--obs-scale)) !important; }

        /* Tema claro en OBS */
        :root[data-mode="light"] .obs-msg,
        :root[data-mode="light"] .obs-amount { background: rgba(15, 23, 42, 0.06) !important; }
        :root[data-mode="light"] .obs-alert { box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18) !important; }
        :root[data-mode="light"] .obs-tag.ceneka { color: #6D28D9; }
        :root[data-mode="light"] .obs-tag.youtube { color: #BE123C; }
        :root[data-mode="light"] .obs-tag.twitch { color: #6D28D9; }
        :root[data-mode="light"] .obs-tag.kick { color: #15803D; }
        :root[data-mode="light"] .obs-amount { color: #047857 !important; }
        :root[data-mode="light"] .obs-avatar { color: #111827 !important; }

        /* ===== Tema OVNI: fondo negro con estrellas y luz recorriendo los bordes ===== */
        @property --xf-ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes xfSpin { to { --xf-ang: 360deg; } }
        :root[data-fx="xfiles"] { background: #000 !important; }
        :root[data-fx="xfiles"] body { background: transparent !important; }
        :root[data-fx="xfiles"] #obs-scroll-area { z-index: 1; }
        :root[data-fx="xfiles"] .obs-alert {
            border-color: rgba(0, 255, 65, 0.35) !important;
            background: rgba(var(--obs-bg-rgb), 0.66);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 22px rgba(0, 255, 65, 0.3) !important;
        }
        :root[data-fx="xfiles"] .obs-alert::after {
            content: ''; position: absolute; inset: 0; border-radius: 12px; padding: 2px; pointer-events: none;
            background: conic-gradient(from var(--xf-ang), transparent 0deg 250deg, rgba(0,255,65,0.15) 280deg,
                #00FF41 320deg, #E8FFE8 340deg, #00FF41 350deg, transparent 360deg);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            animation: xfSpin 4.5s linear infinite;
        }
        :root[data-fx="xfiles"] .obs-alert:nth-child(3n+2)::after { animation-delay: -1.5s; }
        :root[data-fx="xfiles"] .obs-alert:nth-child(3n)::after { animation-delay: -3s; }
        :root[data-fx="xfiles"] .obs-amount { font-family: 'Consolas', 'Courier New', monospace; text-shadow: 0 0 6px rgba(0,255,65,0.7); }
        :root[data-fx="xfiles"] .obs-nick span:first-child { text-shadow: 0 0 6px rgba(0,255,65,0.45); }

        /* Aviso de nuevas mientras leés (pausa de scroll) */
        /* Aviso compacto de nuevas (dentro de la barra superior) */
        .obs-new-indicator {
            display: none; margin-left: auto; flex-shrink: 0;
            padding: 3px 10px; border-radius: 999px; border: none; cursor: pointer;
            font-family: inherit; font-weight: 800; font-size: calc(0.74rem * var(--obs-scale));
            background: var(--obs-accent); color: var(--obs-on-accent, #fff);

        .obs-new-indicator.show { display: inline-flex; align-items: center; gap: 4px; }

        /* Menú para elegir plataforma */
        #obs-filter { display: none; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }

        .obs-filter-btn {

            padding: 4px 10px; border-radius: 8px; border: 1px solid transparent;
            background: transparent; color: var(--obs-text); cursor: pointer;
            font-family: inherit; font-weight: 700; font-size: calc(0.78rem * var(--obs-scale));
            opacity: 0.7; transition: background 0.15s, opacity 0.15s;

        .obs-alert.filtered-out, .obs-alert.not-linked { display: none !important; }

        /* ===== Colores por plataforma (los elige el streamer en la app) ===== */
        :root {
            --pc-ceneka: #8B5CF6; --pc-ceneka-rgb: 139, 92, 246;
            --pc-youtube: #FF2E4D; --pc-youtube-rgb: 255, 46, 77;
            --pc-twitch: #9146FF; --pc-twitch-rgb: 145, 70, 255;
            --pc-kick: #53FC18; --pc-kick-rgb: 83, 252, 24;
        }
        .obs-alert.ceneka { border-color: var(--pc-ceneka); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(var(--pc-ceneka-rgb), 0.35); }
        .obs-alert.ceneka .obs-msg { border-left-color: var(--pc-ceneka); }
        .obs-tag.ceneka { background: rgba(var(--pc-ceneka-rgb), 0.3); color: color-mix(in srgb, var(--pc-ceneka) 55%, #fff); border: 1px solid rgba(var(--pc-ceneka-rgb), 0.5); }
        :root[data-mode="light"] .obs-tag.ceneka { color: color-mix(in srgb, var(--pc-ceneka) 70%, #000); }
        .obs-alert.youtube { border-color: var(--pc-youtube); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(var(--pc-youtube-rgb), 0.35); }
        .obs-alert.youtube .obs-msg { border-left-color: var(--pc-youtube); }
        .obs-tag.youtube { background: rgba(var(--pc-youtube-rgb), 0.3); color: color-mix(in srgb, var(--pc-youtube) 55%, #fff); border: 1px solid rgba(var(--pc-youtube-rgb), 0.5); }
        :root[data-mode="light"] .obs-tag.youtube { color: color-mix(in srgb, var(--pc-youtube) 70%, #000); }
        .obs-alert.twitch { border-color: var(--pc-twitch); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(var(--pc-twitch-rgb), 0.35); }
        .obs-alert.twitch .obs-msg { border-left-color: var(--pc-twitch); }
        .obs-tag.twitch { background: rgba(var(--pc-twitch-rgb), 0.3); color: color-mix(in srgb, var(--pc-twitch) 55%, #fff); border: 1px solid rgba(var(--pc-twitch-rgb), 0.5); }
        :root[data-mode="light"] .obs-tag.twitch { color: color-mix(in srgb, var(--pc-twitch) 70%, #000); }
        .obs-alert.kick { border-color: var(--pc-kick); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(var(--pc-kick-rgb), 0.35); }
        .obs-alert.kick .obs-msg { border-left-color: var(--pc-kick); }
        .obs-tag.kick { background: rgba(var(--pc-kick-rgb), 0.3); color: color-mix(in srgb, var(--pc-kick) 55%, #fff); border: 1px solid rgba(var(--pc-kick-rgb), 0.5); }
        :root[data-mode="light"] .obs-tag.kick { color: color-mix(in srgb, var(--pc-kick) 70%, #000); }

        /* Fondo propio de la ventana OBS (color o imagen/GIF) */
        #obs-bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; display: none; background-position: center; }
        #obs-bg::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, var(--obs-bg-dim, 0)); }
        :root.has-obs-bg, :root.has-obs-bg body { background: transparent !important; }
        :root.has-obs-bg #obs-bg { display: block; }

        /* Modo transparente: fondo de un color puro para recortarlo en OBS (Clave cromática).
           Sin sombras, brillos ni transparencias, así el recorte queda limpio. */
        :root.obs-chroma, :root.obs-chroma body { background: var(--obs-chroma) !important; }
        :root.obs-chroma #obs-bg { display: none !important; }
        :root.obs-chroma *, :root.obs-chroma *::before, :root.obs-chroma *::after {
            box-shadow: none !important; text-shadow: none !important; filter: none !important;
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        }
        :root.obs-chroma .obs-alert, :root.obs-chroma .obs-status-box, :root.obs-chroma .obs-preview-bar, :root.obs-chroma #obs-top { background: rgb(var(--obs-bg-rgb)) !important; }
        :root.obs-chroma #obs-scroll-area { scrollbar-width: none; }

        /* Tamaño de nombre, foto y botón (separado del mensaje) */
        :root { --obs-head-scale: 0.75; }

        /* Flechita de orden en el menú */
        .obs-filter-btn .sort-arrow { font-size: 0.7em; margin-left: -2px; opacity: 0.9; }

<body>
